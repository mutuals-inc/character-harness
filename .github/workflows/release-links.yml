name: Update player download links

on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: player-release-links
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/update-release-links.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit updated download links
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "docs: update player download links"
          git push
