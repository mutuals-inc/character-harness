<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kaigen web player</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      #canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <!-- Studio opens this page in its stage. Settings come from the URL, as
         for any web build of the player; the frame is drawn with a clear
         background so Studio's shows around the character. -->
    <script type="module">
      const tell = (message) => parent.postMessage({ t: "web-player", ...message }, location.origin);
      async function start() {
        if (!crossOriginIsolated)
          return tell({ error: "This browser can't isolate the web player (it needs Chrome or Edge 137 or later)." });
        const adapter = await navigator.gpu?.requestAdapter().catch(() => null);
        if (!adapter) return tell({ error: "WebGPU is unavailable in this browser." });
        const { createGame } = await import("./main.js");
        const game = createGame({ canvas: document.getElementById("canvas"), allowFullscreen: false });
        game.oncrash = (message) => tell({ error: `The web player stopped: ${message || "it crashed"}.` });
        tell({ started: true });
      }
      start().catch((error) => tell({ error: `The web player could not start: ${error?.message ?? error}` }));
    </script>
  </body>
</html>
